
      # 7. نصب مستقیم vcpkg با نسخه اختصاصی Windscribe
      - name: Install and verify vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $commit = "0699a19d0c6386247ce50d4dedbb8217d484d536"
          $root = $env:VCPKG_ROOT
          $registry = Join-Path $PWD "ws-vcpkg-registry"

          Write-Host "Preparing clean vcpkg installation..."

          if (Test-Path $root) {
            Remove-Item $root -Recurse -Force
          }

          New-Item -ItemType Directory -Path $root -Force | Out-Null

          # دریافت مستقیم مخزن اصلی
          git -C $root init
          if ($LASTEXITCODE -ne 0) {
            throw "Git initialization failed"
          }

          git -C $root remote add origin https://github.com/microsoft/vcpkg.git
          if ($LASTEXITCODE -ne 0) {
            throw "Adding vcpkg remote failed"
          }

          # دریافت Commit دقیق موردنیاز Windscribe
          git -C $root fetch --depth 1 origin $commit
          if ($LASTEXITCODE -ne 0) {
            throw "Fetching required vcpkg commit failed"
          }

          git -C $root checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "Checking out required vcpkg commit failed"
          }

          # اعمال Patch اختصاصی Windscribe
          $patch1 = Join-Path $registry "install-vcpkg\patches\vcpkg_configure_cmake.patch"
          $patch2 = Join-Path $registry "install-vcpkg\patches\ios_toolchain.patch"

          foreach ($patch in @($patch1, $patch2)) {
            if (-not (Test-Path $patch)) {
              throw "Required patch not found: $patch"
            }

            git -C $root apply $patch
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to apply patch: $patch"
            }
          }

          # نصب فایل‌های اختصاصی Triplet
          $tripletSource = Join-Path $registry "triplets"
          $tripletTarget = Join-Path $root "triplets"

          if (-not (Test-Path $tripletSource)) {
            throw "Windscribe triplets folder not found"
          }

          New-Item -ItemType Directory -Path $tripletTarget -Force | Out-Null

          Get-ChildItem $tripletSource -Filter "*.cmake" |
            Copy-Item -Destination $tripletTarget -Force

          # ساخت vcpkg.exe
          $bootstrap = Join-Path $root "bootstrap-vcpkg.bat"

          if (-not (Test-Path $bootstrap)) {
            throw "bootstrap-vcpkg.bat not found"
          }

          cmd /c "`"$bootstrap`" -disableMetrics"
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg bootstrap failed"
          }

          # بررسی نهایی
          $toolchain = Join-Path $root "scripts\buildsystems\vcpkg.cmake"
          $vcpkgExe = Join-Path $root "vcpkg.exe"

          if (-not (Test-Path $toolchain)) {
            throw "vcpkg.cmake is missing"
          }

          if (-not (Test-Path $vcpkgExe)) {
            throw "vcpkg.exe is missing"
          }

          $actualCommit = git -C $root rev-parse HEAD

          if ($actualCommit.Trim() -ne $commit) {
            throw "Installed vcpkg commit does not match"
          }

          Write-Host "VCPKG installation successful."
          Write-Host "Commit: $actualCommit"

          & $vcpkgExe version

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg version verification failed"
          }
